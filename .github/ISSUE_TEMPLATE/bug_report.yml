name: Bug / Ошибка
description: Report unexpected behavior / Сообщить об ошибке
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Не публикуйте пароли, токены, email и личные записи. / Do not publish passwords, tokens, email addresses or personal notes."
  - type: input
    id: version
    attributes:
      label: Версия приложения и iOS / App and iOS version
      placeholder: "FrameTrail 1.0.0-beta.1, iOS 26.5"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло / Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Как должно работать / Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Безопасный пример или скриншот / Redacted example or screenshot
