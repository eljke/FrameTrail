name: Build and release

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select stable Xcode
        run: echo "DEVELOPER_DIR=$(python3 scripts/select_xcode.py)" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Validate repository
        run: |
          python3 scripts/validate.py
          python3 scripts/test_delivery.py
      - name: Test core behavior
        run: swift test --package-path Packages/FrameTrailCore
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select iPhone simulator
        run: echo "SIMULATOR_ID=$(python3 scripts/select_simulator.py)" >> "$GITHUB_ENV"
      - name: Build and test on simulator
        run: >-
          xcodebuild -project FrameTrail.xcodeproj -scheme FrameTrail
          -configuration Debug -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/simulator
          -resultBundlePath build/FrameTrailTests.xcresult
          -parallel-testing-enabled NO
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Export test screenshots
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/FrameTrailTests.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/FrameTrailTests.xcresult --output-path build/test-attachments
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameTrail-tests
          path: |
            build/FrameTrailTests.xcresult
            build/test-attachments
          if-no-files-found: ignore
          retention-days: 14
      - name: Build unsigned device app
        run: >-
          xcodebuild -project FrameTrail.xcodeproj -scheme FrameTrail
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA and verify size
        run: |
          VERSION="$(cat VERSION)"
          python3 scripts/package_ipa.py \
            --app build/device/Build/Products/Release-iphoneos/FrameTrail.app \
            --version "$VERSION" --output dist --max-size-mb 40
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrameTrail-unsigned
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version and tested branch commit
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate.py --version "$RELEASE_TAG"
          BASE_VERSION="$(python3 -c 'from scripts.validate import semantic_version; import os; print(semantic_version(os.environ["RELEASE_TAG"])[1])')"
          RELEASE_BRANCH="release/$BASE_VERSION"
          git fetch origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")"
          VERIFIED_RUN="$(gh run list --workflow build.yml --branch "$RELEASE_BRANCH" --commit "$RELEASE_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$VERIFIED_RUN"
          echo "run_id=$VERIFIED_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: FrameTrail-unsigned
          path: dist
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify promoted artifact integrity
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.ipa dist/*.sha256 \
            --verify-tag --title "FrameTrail ${RELEASE_TAG#v}" \
            "${PRERELEASE[@]}" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md"
